# @package _global_
# Wan2.2-TI2V-5B backbone config for two-view LIBERO at 224x224 per view.
#
# DreamTransform concatenates the two LIBERO cameras horizontally:
#   primary | wrist
# so the DiT/VAE input resolution is 224x448.
#
# Shape math:
#   VAE38 spatial downsample: 224x448 -> latent 14x28
#   CausalWanModel patch stride: (1, 2, 2) -> per-frame tokens 7x14 = 98

defaults:
  - wan_flow_matching_action_tf_wan22

frame_seqlen: 98

action_head_cfg:
  config:
    target_video_height: 224
    target_video_width: 448
    diffusion_model_cfg:
      frame_seqlen: 98
